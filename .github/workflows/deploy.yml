name: Platform Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: Infrastructure as Code Security & Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::640494160208:role/github-actions-terragrunt-role-prod
          aws-region: us-east-1

      - name: Install SOPS
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
        with:
          version: "v3.8.1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "1.1.4"

      # --- SECURITY SCANNING: CHECKOV ---
      - name: Run Checkov Inspection
        uses: bridgecrewio/checkov-action@master
        with:
          # Scans your IaC files for security and compliance misconfigurations
          directory: .
          framework: terraform
          soft_fail: false # Set to true if you only want warnings without breaking the build initially

      # --- POLICY AS CODE: OPA / CONFTEST ---
      # - name: Setup OPA and Conftest
      #   uses: open-policy-agent/setup-opa@v2
      #   with:
      #     opa_version: latest

      # - name: Run Conftest Policy Checks
      #   run: |
      #     # Install conftest binary
      #     VERSION="0.55.0"
      #     curl -L "https://github.com/open-conftest/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" | tar xz
      #     sudo mv conftest /usr/local/bin

      #     # Optional: Run conftest if you have a /policy directory in your repo
      #     # conftest test env/prod/ --policy policy/
      #     echo "Conftest binary is ready for your custom policies."

      # --- DEPLOYMENT STEPS ---
      - name: Terragrunt Plan
        working-directory: env/prod
        run: terragrunt plan --terragrunt-non-interactive

      - name: Terragrunt Apply
        working-directory: env/prod
        run: terragrunt apply -auto-approve --terragrunt-non-interactive
